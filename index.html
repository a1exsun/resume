<script id="theme-init">
  // Runs before first paint. Arriving from the portfolio always means dark; a choice made here
  // (toggle or portfolio) lasts for the tab session; otherwise the system setting decides.
  (() => {
    const url = new URL(location.href);
    const fromPortfolio = url.searchParams.get('from') === 'portfolio';
    let stored = null;
    try {
      if (fromPortfolio) sessionStorage.setItem('theme', 'dark');
      stored = sessionStorage.getItem('theme');
    } catch {}
    if (fromPortfolio) {
      url.searchParams.delete('from');
      history.replaceState(history.state, '', url);
    }
    const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme =
      fromPortfolio ? 'dark' : stored === 'dark' || stored === 'light' ? stored : system;
  })();
</script>
